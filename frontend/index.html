<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fashionable Fit Check</title>
</head>

<body>

    <h1>👕 Fashionable Fit Check</h1>

    <p>Find out how a product will fit you.</p>

    <h2>Your Measurements</h2>

    <label>Chest (cm):</label>
    <input type="number" id="userChest">

    <br><br>

    <label>Waist (cm):</label>
    <input type="number" id="userWaist">

    <br><br>

    <label>Hip (cm):</label>
    <input type="number" id="userHip">

    <br><br>

    <label>Shoulder (cm):</label>
    <input type="number" id="userShoulder">

    <br><br>

    <button onclick="checkFit()">Check Fit</button>

<h2>Result</h2>

<p id="result">Enter your measurements to check the fit.</p>

<script>
function checkFit() {
    const chest = Number(document.getElementById("userChest").value);
    const waist = Number(document.getElementById("userWaist").value);
    const hip = Number(document.getElementById("userHip").value);
    const shoulder = Number(document.getElementById("userShoulder").value);

    if (!chest || !waist || !hip || !shoulder) {
        document.getElementById("result").textContent =
            "Please enter all measurements.";
        return;
    }

    document.getElementById("result").textContent =
        "Measurements received! ML prediction will be connected next.";
}
</script>
<script>
async function checkFit() {

    const chest = Number(document.getElementById("userChest").value);
    const waist = Number(document.getElementById("userWaist").value);
    const hip = Number(document.getElementById("userHip").value);
    const shoulder = Number(document.getElementById("userShoulder").value);

    if (!chest || !waist || !hip || !shoulder) {
        document.getElementById("result").textContent =
            "Please enter all measurements.";
        return;
    }

    // Temporary product measurements
    const productChest = 98;
    const productWaist = 90;
    const productHip = 100;
    const productShoulder = 45;

    try {

        const response = await fetch("http://127.0.0.1:5001/predict", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                user_chest: chest,
                user_waist: waist,
                user_hip: hip,
                user_shoulder: shoulder,

                product_chest: productChest,
                product_waist: productWaist,
                product_hip: productHip,
                product_shoulder: productShoulder
            })
        });

        const data = await response.json();

        document.getElementById("result").textContent =
            "Recommended Fit: " + data.fit_result;

    } catch (error) {

        document.getElementById("result").textContent =
            "Unable to connect to the ML server.";
    }
}
</script>
</body>
</html>
